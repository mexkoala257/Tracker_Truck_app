<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ibsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009A44" />
      <stop offset="100%" stop-color="#006B2F" />
    </linearGradient>
    <linearGradient id="ibsRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4002B" />
      <stop offset="100%" stop-color="#B80022" />
    </linearGradient>
  </defs>
  <!-- Battery Terminal Posts -->
  <rect x="24" y="8" width="18" height="10" rx="3" fill="#94A3B8" stroke="#0F172A" stroke-width="2" />
  <rect x="78" y="8" width="18" height="10" rx="3" fill="#94A3B8" stroke="#0F172A" stroke-width="2" />
  <!-- Main Battery Case (Interstate Green) -->
  <rect x="10" y="16" width="100" height="94" rx="14" fill="url(#ibsGreen)" stroke="#FFFFFF" stroke-width="4" />
  <!-- Top Red Interstate Stripe Banner -->
  <path d="M 14 30 Q 14 20 24 20 L 96 20 Q 106 20 106 30 L 106 46 L 14 46 Z" fill="url(#ibsRed)" />
  <!-- IBS Monogram & Lightning Bolt -->
  <text x="60" y="39" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="18" letter-spacing="1.5">INTERSTATE</text>
  <!-- Gold Lightning Bolt Crest -->
  <polygon points="65,50 45,76 58,76 52,102 77,72 63,72" fill="#FACC15" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
  <!-- SD Badge -->
  <text x="26" y="99" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="12" opacity="0.95">SD</text>
</svg>
